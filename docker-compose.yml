services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.example
    environment:
      MONGO_URI: mongodb://mongo:27017/budgetwise_ai
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo
    ports:
      - "5000:5000"
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    depends_on:
      - backend
    ports:
      - "5173:80"
volumes:
  mongo-data:
